<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Encryption Key</title>

<script src="config.js"></script>
<script src="encryption.js"></script>

<style>
body{
    background:#0b0b0b;
    color:white;
    font-family:Inter,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.card{
    width:min(420px,90%);
    background:#171717;
    border:1px solid #333;
    border-radius:18px;
    padding:30px;
    text-align:center;
}
.spinner{
    width:38px;
    height:38px;
    border:4px solid #333;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}
@keyframes spin{
to{transform:rotate(360deg);}
}
#status{
margin-top:20px;
color:#aaa;
}
button{
margin-top:25px;
padding:12px 18px;
border:none;
border-radius:10px;
background:white;
color:black;
font-weight:bold;
cursor:pointer;
display:none;
}
</style>

</head>
<body>

<div class="card">

<div class="spinner" id="spinner"></div>

<h2>Importing Encryption Key</h2>

<p id="status">
Please wait...
</p>

<button id="continueBtn">
Continue
</button>

</div>

<script>

(async()=>{

try{

const transferId=
new URLSearchParams(location.search).get("id");

if(!transferId)
throw new Error("Missing transfer id.");

const keys=await ensureDeviceKeys();

const myDeviceId=keys.deviceId;

const res=await fetch(
`${API_URL}/device/transfer/${transferId}`,
{
credentials:"include"
});

if(!res.ok)
throw new Error("Transfer not found or expired.");

const data=await res.json();

if(data.device_id!==myDeviceId){
throw new Error("This transfer belongs to another device.");
}

// decrypt KEK

const rawKEK=
await decryptPEKWithPrivateKey(
data.encrypted_kek,
keys.privateKey
);

// import AES key

const accountKEK=
await crypto.subtle.importKey(
"raw",
rawKEK,
{
name:"AES-GCM"
},
true,
["encrypt","decrypt"]
);

await saveToDB(
"accountKEK",
accountKEK
);

// notify server

await fetch(
`${API_URL}/device/complete-transfer`,
{
method:"POST",
credentials:"include",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
transfer_id:transferId
})
}
);

document.getElementById("spinner").style.display="none";

document.getElementById("status").innerHTML=
"✅ Device approved successfully.<br>Your encryption key has been imported.";

const btn=document.getElementById("continueBtn");

btn.style.display="inline-block";

btn.onclick=()=>{
location.href="/dashboard.html";
};

}
catch(e){

console.error(e);

document.getElementById("spinner").style.display="none";

document.getElementById("status").textContent=e.message;

}

})();

</script>

</body>
</html>
